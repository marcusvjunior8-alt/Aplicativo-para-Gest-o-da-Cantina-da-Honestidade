<!doctype html>
<html lang="pt-br">

<head>
    <!-- Configurações da página -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../images/favicon.png">
    <title>Cantina da Bondade - Perfil</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/css.css" />

    <!-- JavaScript -->
    <script src="../Js/perfil.js" defer></script>
</head>

<body>

    <!-- Conteúdo inteiro da página -->
    <div class="conteudo" id="conteudo">

        <!-- Menu lateral (Drawer) -->
        <div class="lado" id="lado">
            <!-- Botão para fechar o menu -->
            <button class="btn-fechar" onclick="traitMenu()">&times;</button>

            <!-- Logo -->
            <div class="logo" id="logo">
                <img src="../images/Aug 14, 2026, 03_21_48 PM.png" alt="LOGO" class="logo" />
            </div>

            <!-- Ícones/Menu -->
            <div class="icons" id="icons">

                <!-- Início -->
                <div class="inicio" id="inicio">
                    <div class="imgInicio" id="imgInicio">
                        <img src="../images/home.png" alt="home" />
                    </div>

                    <div class="txthome" id="txthome">
                        <h4 class="txinicio"><a href="./teladeprodutos.html" class="link">Início</a></h4>
                    </div>
                </div>


                <!-- Histórico -->
                <div class="historico" id="historico">
                    <div class="imghistorico" id="imghistorico">
                        <img src="../images/carteira.png" alt="home" />
                    </div>

                    <div class="txthistorico" id="txthistorico">
                        <h4 class="txhistorico"><a href="./historico.html" class="link">Histórico</a></h4>
                    </div>
                </div>

                <!-- Perfil -->
                <div class="perfil" id="perfil">
                    <div class="imgPerfil" id="imgPerfil">
                        <img src="../images/carteira.png" alt="home" />
                    </div>

                    <div class="imgPerfil" id="imgPerfilAlt">
                        <h4 class="txperfil"><a href="./perfil.html" class="link">Perfil</a></h4>
                    </div>
                </div>

            </div>

            <!-- Sair -->
            <div class="sair" id="sair">
                <a href="./index.html" class="link-sair">
                    <div class="imgSair" id="imgSair">
                        <img src="../images/carteira.png" alt="Sair" width="24px" height="24px" />
                    </div>
                    <div class="txtSair" id="txtSair">
                        <h4 class="butaosair">Sair</h4>
                    </div>
                </a>
            </div>

        </div>

        <!-- Parte direita da página -->
        <div class="direita">

            <!-- Cabeçalho -->
            <div class="cima" id="cima">
                <button id="btnMenu" class="btn-menu" onclick="traitMenu()">
                    &#9776; <!-- Ícone de 3 traços -->
                </button>
                <div>
                    <h2>Hello, Student!</h2>
                    <p>Configurações do seu perfil</p>
                </div>
            </div>

            <!-- Container do Perfil -->
            <div class="perfil-container">

                <div class="perfil-card">
                    <!-- Cabeçalho do Card de Perfil -->
                    <div class="perfil-header">
                        <div class="perfil-foto-container">
                            <img src="../images/perfil.png" alt="Foto de Perfil do Usuário" id="fotoPerfil"
                                class="perfil-foto">
                        </div>
                        <div class="perfil-info-basica">
                            <h3 id="nomeUsuario">Nome do Usuário</h3>
                            <p id="matriculaUsuario">Matrícula: 000000</p>
                        </div>
                    </div>

                    <hr class="perfil-divisor">

                    <!-- Formulário de dados de teste/mock -->
                    <form class="perfil-form" id="formPerfil" onsubmit="salvarPerfil(event)">

                        <div class="campo-grupo">
                            <label for="inputNome">Nome Completo</label>
                            <input type="text" id="inputNome" class="input-perfil" />
                        </div>

                        <div class="campo-grupo">
                            <label for="inputEmail">E-mail</label>
                            <input type="email" id="inputEmail" class="input-perfil" />
                        </div>

                        <div class="campo-grupo">
                            <label for="inputMatricula">Matrícula</label>
                            <input type="text" id="inputMatricula" class="input-perfil" disabled />
                        </div>

                        <div class="campo-grupo">
                            <label for="inputCurso">Curso</label>
                            <input type="text" id="inputCurso" class="input-perfil" />
                        </div>

                        <div class="perfil-botoes">
                            <button type="submit" class="btn-salvar">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Fundo escuro cobrindo a tela quando o menu abre -->
    <div class="overlay" id="overlay" onclick="traitMenu()"></div>

</body>

</html>
